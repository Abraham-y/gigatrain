name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests across OS and architecture. These cover the merge semantics,
  # the whitespace splitter's equivalence to str::split_whitespace over every
  # BMP codepoint, and the range reader's invariance to how input is split.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --manifest-path gigatrain/Cargo.toml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path gigatrain/Cargo.toml -- --check
      - run: cargo clippy --manifest-path gigatrain/Cargo.toml --all-targets -- -D warnings
      # `python` is off by default, so the bindings — the code that ships to
      # PyPI — were never linted here even though release.yml builds them.
      # A clippy error sat in python.rs undetected because of this gap.
      - run: cargo clippy --manifest-path gigatrain/Cargo.toml --features python --all-targets -- -D warnings

  # The milestone-2 gate: byte-exact merge-list parity with HuggingFace
  # tokenizers across corpus configurations, plus fuzzing and a check that
  # output does not depend on thread count. Runs on Linux/glibc, so it also
  # confirms the results are not specific to the macOS allocator.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tokenizers==0.22.2
      - run: bash scripts/run_parity_ci.sh

  # The Python bindings must produce a tokenizer.json that HF loads and that
  # encodes identically - that is what makes this a drop-in rather than a
  # merge-list generator.
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tokenizers==0.22.2 maturin
      - run: maturin build --release --features python --manifest-path gigatrain/Cargo.toml
      - run: pip install --find-links gigatrain/target/wheels gigatrain
      # -f: an HTTP error must fail the step, not feed an error page to the check
      - run: curl -fsSL -o /tmp/wp.txt https://www.gutenberg.org/files/2600/2600-0.txt
      - run: python scripts/check_bindings.py /tmp/wp.txt
